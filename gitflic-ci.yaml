# GitFlic CI for the AgentMarshal repository.
#
# Self-hosting: governance is the v2 `agentmarshal validate` (journal
# integrity), run inside the python job. The v1 submodule is no longer a
# CI dependency.

stages:
  - test

python:
  stage: test
  image: python:3.12-slim
  tags:
    - docker
  variables:
    PYTHONUTF8: "1"
  script:
    # The slim image ships without git, which both the package under test
    # and the test fixtures require.
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git
    - pip install --no-cache-dir uv
    - uv sync --locked
    - uv run agentmarshal validate
    - uv run pytest
    - uv run ruff check
    - uv run ruff format --check
    - uv run mypy
  rules:
    - if: $CI_COMMIT_REF_NAME == "master"
    - if: $CI_COMMIT_REF_NAME =~ /^(docs|fix|feat|ci|completion)\//
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
