[project]
name = "agentmarshal"
version = "0.3.0"
description = "Agent work attestation and merge governance: SHA-bound evidence rails for agent-driven development"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Andrei Tropichev" }]
requires-python = ">=3.12"
dependencies = []
keywords = [
    "attestation",
    "provenance",
    "governance",
    "merge-gate",
    "code-review",
    "agents",
    "ci",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/agentmarshal/agentmarshal"

[project.scripts]
agentmarshal = "agentmarshal.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.16",
    "pytest>=8.4",
    "ruff>=0.12",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
src = ["src", "tests"]
extend-exclude = ["./agentmarshal"]  # v1 archive submodule at repo root, not our src

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
