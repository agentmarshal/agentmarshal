# AgentMarshal's own governance on GitHub (Variant 2).
# `governance` (validate + tests) and `gate` are required-suitable; mark them
# required in branch protection. See docs/github-enforcement.md.
name: AgentMarshal governance

on:
  pull_request:
  push:
    # Repository-specific: this repository's default branch is `master`.
    branches: [master]

# Least privilege: pull-request-controlled code must not inherit
# write-capable default token permissions. Scope more only per job.
permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # validate/gate need full history
      # Repository-specific: the project uses its locked uv environment rather
      # than the template's generic Python/package installation.
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      # Repository-specific: these are this project's checks in place of the
      # template's <TEST_COMMAND> placeholder.
      - run: uv run agentmarshal validate
      - run: uv run pytest
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy

  gate:
    # Required check (Variant 2), not the merge authority. A head cannot carry
    # a review of itself, so this run asks the gate to judge every check that
    # does not depend on one. The transcript names what it did not examine.
    # Scope, append-only, base-state and lifecycle are enforced here.
    # The approved-independent-review requirement is NOT enforced by this job
    # and nothing shipped enforces it on this provider; see
    # docs/github-enforcement.md. Safe to mark REQUIRED for what it does check.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      # Repository-specific: run the checked-out source from this project's
      # locked uv environment rather than installing the generic template package.
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - name: Gate
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          task="$(printf '%s' "$HEAD_REF" | grep -oE 'CR-[0-9]+' | head -1)"
          # Phase C: materialise the review record from the PR approval before
          # this step for the review-bound lane.
          # Repository-specific: invoke the checked-out source through uv.
          uv run agentmarshal gate --attestation ci-required --without-review \
            --task "$task" \
            --commit "$HEAD_SHA" \
            --base "origin/${BASE_REF}"
