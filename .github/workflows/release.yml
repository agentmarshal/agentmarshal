# Publish to PyPI on a version tag, using Trusted Publishing (OIDC) — no
# API token. Inert until (1) a `v*` tag is pushed and (2) a pending
# publisher is configured on PyPI:
#   owner=<GH_OWNER>, repo=agentmarshal, workflow=release.yml,
#   environment=pypi.
# Dry-run first against TestPyPI (add a `repository-url` input) before the
# real index. The tag must match the pyproject version.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC for PyPI Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build sdist and wheel
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No `password:` — OIDC Trusted Publishing authenticates the run.
        # Uploads the artifacts in ./dist produced by `uv build`.
