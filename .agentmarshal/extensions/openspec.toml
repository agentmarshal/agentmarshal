# Extension manifest (ADR-0010). Declares what OpenSpec owns in this
# repository; AgentMarshal executes none of the strings below.
#
# `openspec init --tools claude,codex` also writes six commands and six skills
# under .claude/, which this repository ignores wholesale (.gitignore:
# `.claude/`). Those assets are local to the machine that ran the install and
# never reach a diff, so they are not part of this footprint: the gate can
# neither see them nor verify their removal.
#
# The skill files under .agents/skills/ are generated by the tool and carry
# their licence in their front matter (MIT; package copyright 2024 OpenSpec
# Contributors). They invoke the `openspec` CLI (allowed-tools:
# Bash(openspec:*)), so an agent applying a change needs that CLI on PATH or
# through npx — nothing here provides it.
schema = 1
name = "openspec"
version = "1.12.0"
footprint = [
  "openspec/",
  ".agents/skills/openspec-apply-change/",
  ".agents/skills/openspec-archive-change/",
  ".agents/skills/openspec-explore/",
  ".agents/skills/openspec-propose/",
  ".agents/skills/openspec-sync-specs/",
  ".agents/skills/openspec-update-change/",
  ".agents/skills/.openspec-target",
]
documents = ["openspec/specs/"]
artifacts = ["openspec/changes/archive/"]
install = "OPENSPEC_TELEMETRY=0 npx -y @fission-ai/openspec@1.12.0 init --tools claude,codex --no-animation ."
remove = "rm -rf openspec .agents/skills/openspec-* .agents/skills/.openspec-target .claude/commands/opsx .claude/skills/openspec-*"
